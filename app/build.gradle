plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jamhelper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jamhelper'
        minSdk 24          // Android 7 以上；11 以上用無障礙截圖，10 以下用螢幕錄影
        versionCode 2
        versionName '1.1'
        targetSdk 34
    }

    // 簽章：金鑰加密存放在 release.keystore.enc，密碼放在 GitHub Secrets（KEYSTORE_PASSWORD）
    // 由 GitHub Actions 解密後透過環境變數傳入；本機建置沒有金鑰時改用預設 debug 簽章
    def ksFile = System.getenv('KEYSTORE_FILE')
    def ksPass = System.getenv('KEYSTORE_PASSWORD')
    if (ksFile && ksPass) {
        signingConfigs {
            fixed {
                storeFile file(ksFile)
                storePassword ksPass
                keyAlias 'jamhelper'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        debug {
            if (ksFile && ksPass) signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            if (ksFile && ksPass) {
                signingConfig signingConfigs.fixed
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

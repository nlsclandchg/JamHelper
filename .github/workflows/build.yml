name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # 允許建立 Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk JamHelper.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JamHelper-apk
          path: JamHelper.apk

      # 每次建置自動發佈成最新版 Release，手機可直接下載 APK
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" JamHelper.apk \
            --title "果醬解謎助手 第 ${{ github.run_number }} 版" \
            --notes "${{ github.event.head_commit.message }}" \
            --target "${{ github.sha }}" \
            --latest
